<div class="container">
  <h2>RGO Halbjahr 2 – Serienbriefe (Sammel-PDF)</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="terminangabe">Terminangabe (Briefdatum)</label>
      <input
        id="terminangabe"
        type="date"
        class="form-control"
        formControlName="terminangabe"
      />
    </div>

    <div class="form-group">
      <label for="gueltigVon">Gültig von (neues Halbjahr)</label>
      <input
        id="gueltigVon"
        type="date"
        class="form-control"
        formControlName="gueltigVon"
      />
    </div>

    <div class="form-group">
      <label for="anpassungswertInPct">Anpassungswert in %</label>
      <input
        id="anpassungswertInPct"
        type="number"
        class="form-control"
        formControlName="anpassungswertInPct"
        step="0.01"
      />
    </div>

    <div class="form-group">
      <label for="monatlicheMindestrente">Monatliche Mindestrente</label>
      <input
        id="monatlicheMindestrente"
        type="number"
        class="form-control"
        formControlName="monatlicheMindestrente"
        step="0.01"
      />
    </div>

    <div class="form-group">
  <label for="benutzerdefinierterText">
    Benutzerdefinierter Text im Serienbrief
  </label>

  <textarea
    id="benutzerdefinierterText"
    formControlName="benutzerdefinierterText"
    rows="6"
    placeholder="Optional: Wenn dieses Feld leer bleibt, wird der Standardtext verwendet."
  ></textarea>
</div>

    <button type="submit" class="btn btn-primary">
      Sammel-PDF erstellen
    </button>

    <button
      type="button"
      class="btn btn-secondary"
      style="margin-left:12px"
      (click)="back()"
    >
      Zurück
    </button>

  </form>
</div>
