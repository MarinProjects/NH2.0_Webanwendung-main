<div class="login-page">

  <div class="login-box">

    <h1>Neue Heimat</h1>

    <h2>Anmeldung</h2>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="username">
          Benutzername
        </label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">
          Passwort
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
        >
      </div>

      <div
        *ngIf="errorMessage"
        class="error-message"
      >
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Anmeldung...' : 'Anmelden' }}
      </button>

    </form>

  </div>

</div>
