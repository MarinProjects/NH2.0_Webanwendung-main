<!-- GLOBALER HEADER -->
<!-- Nur sichtbar, wenn ein Benutzer angemeldet ist -->
<!-- ================================================= -->

<div
  class="app-header"
  *ngIf="authService.isLoggedIn()"
>

  <div class="user-info">

    <span>
      Angemeldet als:
      <strong>
        {{ authService.getUsername() }}
      </strong>
    </span>

    <button
      type="button"
      class="logout-button"
      (click)="logout()"
    >
      Abmelden
    </button>

  </div>

</div>
